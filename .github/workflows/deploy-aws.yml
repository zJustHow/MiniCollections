name: Deploy to AWS ECS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'minicollections' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'minicollections' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'minicollections' }}
  CONTAINER_NAME: minicollections

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend into backend static resources
        working-directory: frontend
        run: |
          npm ci
          npm run build:backend

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: backend/gradle/wrapper/gradle-wrapper.properties

      - name: Build backend JAR
        working-directory: backend
        run: ./gradlew bootJar --no-daemon

      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            backend
          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "image=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Prepare ECS task definition
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          ECS_TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
          APP_SECRETS_ARN: ${{ vars.APP_SECRETS_ARN }}
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_SSL_ENABLED: ${{ vars.REDIS_SSL_ENABLED || 'true' }}
          ELASTICSEARCH_URIS: ${{ vars.ELASTICSEARCH_URIS }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
          INIT_DB: ${{ vars.INIT_DB || 'never' }}
        run: |
          test -n "${AWS_ACCOUNT_ID}" || (echo "Missing repository variable AWS_ACCOUNT_ID" && exit 1)
          test -n "${ECS_EXECUTION_ROLE_ARN}" || (echo "Missing repository variable ECS_EXECUTION_ROLE_ARN" && exit 1)
          test -n "${ECS_TASK_ROLE_ARN}" || (echo "Missing repository variable ECS_TASK_ROLE_ARN" && exit 1)
          test -n "${APP_SECRETS_ARN}" || (echo "Missing repository variable APP_SECRETS_ARN" && exit 1)
          test -n "${DATABASE_URL}" || (echo "Missing repository variable DATABASE_URL" && exit 1)
          test -n "${REDIS_HOST}" || (echo "Missing repository variable REDIS_HOST" && exit 1)
          test -n "${ELASTICSEARCH_URIS}" || (echo "Missing repository variable ELASTICSEARCH_URIS" && exit 1)
          test -n "${S3_BUCKET}" || (echo "Missing repository variable S3_BUCKET" && exit 1)
          test -n "${S3_PUBLIC_BASE_URL}" || (echo "Missing repository variable S3_PUBLIC_BASE_URL" && exit 1)

          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext-base
          envsubst < deploy/ecs/task-definition.json > task-definition-prepared.json

      - name: Render Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-prepared.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
