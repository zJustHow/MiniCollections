server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://${DATABASE_URL:localhost}:${DATABASE_PORT:5432}/minicollections
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${INIT_DB:always}
      schema-locations: "classpath:database-init.sql"
      data-locations:
        - "classpath:minigt-brand-objects.sql"
        - "classpath:lcd-brand-objects.sql"
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=60s,maximumSize=500

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}

app:
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:true}
  s3:
    enabled: ${S3_ENABLED:true}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:minicollections-media}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/minicollections-media}

logging:
  level:
    root: INFO
---
# Development: SQL and request logs for debugging
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.apache.coyote.http11.Http11InputBuffer: TRACE
    org.springframework.jdbc.datasource.init: DEBUG
    org.springframework.jdbc.core: DEBUG
---

spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
