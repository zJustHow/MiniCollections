server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://${DATABASE_URL:localhost}:${DATABASE_PORT:5432}/minicollections
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${INIT_DB:always}
      schema-locations: "classpath:database-init.sql"
      data-locations:
        - "classpath:seed/minigt/series.sql"
        - "classpath:seed/minigt/brand-objects.sql"
        - "classpath:seed/lcd/brand-objects.sql"
        - "classpath:seed/autoart/brand-objects.sql"
        - "classpath:seed/tomica-limited-vintage/brand-objects.sql"
        - "classpath:seed/kyosho/brand-objects.sql"
        - "classpath:seed/minichamps/series.sql"
        - "classpath:seed/minichamps/brand-objects.sql"
        - "classpath:seed/inno-models/brand-objects.sql"
        - "classpath:seed/xcartoys/brand-objects.sql"
        - "classpath:seed/ignition-model/brand-objects.sql"
        - "classpath:seed/kengfai/brand-objects.sql"
        - "classpath:seed/kj-miniatures/brand-objects.sql"
        - "classpath:seed/motorhelix/series.sql"
        - "classpath:seed/motorhelix/brand-objects.sql"
        - "classpath:seed/tarmac-works/brand-objects.sql"
        - "classpath:seed/modelcollect/brand-objects.sql"
        - "classpath:seed/private-goods-model/brand-objects.sql"
        - "classpath:seed/werk83/brand-objects.sql"
        - "classpath:seed/kiloworks/brand-objects.sql"
        - "classpath:seed/topart-collection/brand-objects.sql"
        - "classpath:seed/autoworld/series.sql"
        - "classpath:seed/autoworld/brand-objects.sql"
        - "classpath:seed/polar-master/brand-objects.sql"
        - "classpath:seed/figart-model/brand-objects.sql"
        - "classpath:seed/frontiart/brand-objects.sql"
        - "classpath:seed/looksmart/brand-objects.sql"
        - "classpath:seed/spark/brand-objects.sql"
        - "classpath:seed/norev/brand-objects.sql"
        - "classpath:seed/ixo-models/brand-objects.sql"
        - "classpath:seed/tsm-model/series.sql"
        - "classpath:seed/tsm-model/brand-objects.sql"
        - "classpath:seed/bbr-models/brand-objects.sql"
        - "classpath:seed/bburago/brand-objects.sql"
        - "classpath:seed/hot-wheels/brand-objects.sql"
        - "classpath:seed/welly/brand-objects.sql"
        - "classpath:seed/mr-collection/brand-objects.sql"
        - "classpath:seed/topspeed-model/series.sql"
        - "classpath:seed/topspeed-model/brand-objects.sql"
        - "classpath:seed/make-up/brand-objects.sql"
        - "classpath:seed/greenlight/series.sql"
        - "classpath:seed/greenlight/brand-objects.sql"
        - "classpath:seed/exoto/brand-objects.sql"
        - "classpath:seed/cmc/brand-objects.sql"
        - "classpath:seed/amalgam/brand-objects.sql"
        - "classpath:seed/almost-real/series.sql"
        - "classpath:seed/almost-real/brand-objects.sql"
        - "classpath:seed/gcd/series.sql"
        - "classpath:seed/gcd/brand-objects.sql"
        - "classpath:seed/tomica/series.sql"
        - "classpath:seed/tomica/brand-objects.sql"
        - "classpath:seed/micro-turbo/brand-objects.sql"
        - "classpath:seed/tiny/series.sql"
        - "classpath:seed/tiny/brand-objects.sql"
        - "classpath:seed/matchbox/series.sql"
        - "classpath:seed/matchbox/brand-objects.sql"
        - "classpath:seed/hobby-japan/series.sql"
        - "classpath:seed/hobby-japan/brand-objects.sql"
        - "classpath:seed/time-micro/series.sql"
        - "classpath:seed/time-micro/brand-objects.sql"
        - "classpath:seed/pop-race/series.sql"
        - "classpath:seed/pop-race/brand-objects.sql"
        - "classpath:seed/maisto/series.sql"
        - "classpath:seed/maisto/brand-objects.sql"
        - "classpath:seed/rhino-models/brand-objects.sql"
        - "classpath:seed/bmc/series.sql"
        - "classpath:seed/bmc/brand-objects.sql"
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=60s,maximumSize=500
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}

wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  redirect-uri: ${WECHAT_REDIRECT_URI:http://localhost:3000/wechat-callback}
  # 公众号（手机微信内）独立凭证，未配置时自动回退到上方 appid/secret/redirect-uri
  mp-appid: ${WECHAT_MP_APPID:}
  mp-secret: ${WECHAT_MP_SECRET:}
  mp-redirect-uri: ${WECHAT_MP_REDIRECT_URI:}

aliyun:
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:MiniCollections}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}

twilio:
  sms:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}

app:
  limits:
    max-groups-per-user: ${MAX_GROUPS_PER_USER:100}
    max-objects-per-group: ${MAX_OBJECTS_PER_GROUP:5000}
    max-submissions-per-day: ${MAX_SUBMISSIONS_PER_DAY:1000}
  verification:
    otp-ttl-seconds: 300
    resend-cooldown-seconds: 60
  view-count:
    dedup-minutes: ${VIEW_COUNT_DEDUP_MINUTES:30}
    flush-interval-ms: ${VIEW_COUNT_FLUSH_INTERVAL_MS:120000}
    event-retention-days: ${VIEW_COUNT_EVENT_RETENTION_DAYS:30}
    purge-events-cron: ${VIEW_COUNT_PURGE_EVENTS_CRON:0 0 4 * * ?}
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:true}
  s3:
    enabled: ${S3_ENABLED:true}
    # S3 endpoint is for the SDK (may be internal, e.g. http://minio:9000 in Docker).
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:minicollections-media}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    # Public URL prefix written into image_url and used for delete — must match how clients fetch media.
    # Local default matches seed SQL (http://localhost:9000/minicollections-media/...). Override per env via S3_PUBLIC_BASE_URL.
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/minicollections-media}

logging:
  level:
    root: INFO
---
# One-off batch: normalize raster brand logos in MinIO (no HTTP server).
spring:
  config:
    activate:
      on-profile: normalize-brand-logos
  main:
    web-application-type: none
  sql:
    init:
      mode: never
---
# Development: SQL and request logs for debugging
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.apache.coyote.http11.Http11InputBuffer: TRACE
    org.springframework.jdbc.datasource.init: DEBUG
    org.springframework.jdbc.core: DEBUG
---

spring:
  config:
    activate:
      on-profile: prod
app:
  s3:
    # In production, set S3_PUBLIC_BASE_URL to your CDN or public MinIO URL (required — no localhost default).
    public-base-url: ${S3_PUBLIC_BASE_URL}
logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
