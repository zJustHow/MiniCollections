version: "3.8"

services:
  db:
    image: postgres:15.2-alpine
    environment:
      POSTGRES_DB: minicollections
      POSTGRES_PASSWORD: secret
      TZ: UTC
    volumes:
      - minicollections-pg-local:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: UTC
    ports:
      - "9200:9200"
    volumes:
      - minicollections-es-local:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: UTC
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minicollections-minio-local:/data

volumes:
  minicollections-pg-local:
  minicollections-es-local:
  minicollections-minio-local:
